# Allow Grafana to load the unsigned SolarNetwork data source plugin.
# This overrides any allow_loading_unsigned_plugins value in grafana.ini. To allow more unsigned
# plugins, set this variable to a comma-separated list that includes
# solarnetwork-solarnetwork-datasource in a drop-in that sorts after this one, for example the
# /etc/systemd/system/grafana-server.service.d/override.conf that "systemctl edit" creates.
[Service]
Environment=GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=solarnetwork-solarnetwork-datasource
